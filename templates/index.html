<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hama Borneo — Dziennik Odczytów</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; background: #f7f9fa; color: #333; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; }
        label { display: block; font-weight: bold; margin-bottom: 0.25rem; font-size: 0.9rem; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 1rem; padding: 0.7rem 1.5rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        button:hover { background: #0052a3; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.6rem; border-bottom: 1px solid #eee; }
        th { background: #fafafa; }
    </style>
</head>
<body>

    <h1>Odczyty: Hama Borneo</h1>

    <div class="card">
        <h2>Wprowadź nowy pomiar</h2>
        <form action="/add" method="post">
            <div class="grid">
                <div>
                    <label for="temperature">Temperatura (°C)</label>
                    <input type="number" step="0.1" id="temperature" name="temperature" placeholder="np. 21.5" required>
                </div>
                <div>
                    <label for="humidity">Wilgotność (%)</label>
                    <input type="number" step="1" id="humidity" name="humidity" min="0" max="100" placeholder="np. 45" required>
                </div>
                <div>
                    <label for="reading_time">Czas pomiaru</label>
                    <input type="datetime-local" id="reading_time" name="reading_time" value="{{ now }}">
                </div>
            </div>
            <button type="submit">Zapisz odczyt</button>
        </form>
    </div>

    <div class="card">
        <h2>Ostatnie pomiary</h2>
        <table>
            <thead>
                <tr>
                    <th>Data i godzina</th>
                    <th>Temperatura</th>
                    <th>Wilgotność</th>
                </tr>
            </thead>
            <tbody>
                {% for r in readings %}
                <tr>
                    <td>{{ r.timestamp.strftime('%Y-%m-%d %H:%M') }}</td>
                    <td><strong>{{ r.temperature }}°C</strong></td>
                    <td>{{ r.humidity }}%</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" style="text-align: center; color: #888;">Brak zapisanych pomiarów.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
